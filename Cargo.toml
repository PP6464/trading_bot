[package]
name = "trading_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }

[[test]]
name = "tests"
path = "tests/mod.rs"
